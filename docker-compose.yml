version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: belajar_mandiri_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: belajar_mandiri
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - belajar_network

  web:
    build: .
    container_name: belajar_mandiri_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=belajar_mandiri
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db
    networks:
      - belajar_network

volumes:
  postgres_data:

networks:
  belajar_network:
    driver: bridge
